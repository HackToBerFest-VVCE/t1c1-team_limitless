<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46F5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="lensRing" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="eyePupil" x1="48" y1="48" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46F5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M60 12 C78 12, 102 18, 106 32 C108 58, 96 88, 60 108 C24 88, 12 58, 14 32 C18 18, 42 12, 60 12 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)" />

  <!-- Shield Inner Border Highlight -->
  <path d="M60 18 C75 18, 96 23, 99 35 C101 56, 90 82, 60 99 C30 82, 19 56, 21 35 C24 23, 45 18, 60 18 Z" 
        stroke="white" 
        stroke-opacity="0.25" 
        stroke-width="2" 
        fill="none" />

  <!-- Optical Magnifying Lens / Protective Eye Outer Ring -->
  <circle cx="60" cy="54" r="26" fill="white" fill-opacity="0.12" stroke="url(#lensRing)" stroke-width="3.5" />

  <!-- Optical Iris -->
  <circle cx="60" cy="54" r="16" fill="white" />
  <circle cx="60" cy="54" r="12" fill="url(#eyePupil)" />
  
  <!-- Lens Flare / Glint -->
  <circle cx="56" cy="50" r="3.5" fill="white" />
  <circle cx="64" cy="58" r="1.5" fill="white" opacity="0.8" />

  <!-- Scanner Crosshair / Verification Marks -->
  <path d="M60 22 L60 27" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
  <path d="M60 81 L60 86" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
  <path d="M28 54 L33 54" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
  <path d="M87 54 L92 54" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />

  <!-- Magnifying Handle Accent -->
  <path d="M78 72 L96 90" stroke="white" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
</svg>
